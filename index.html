<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>portfolio. : Tim Fasanya, web tools</title>
<meta name="description" content="A small collection of single purpose web tools built by Tim Fasanya.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B1220;
    --panel: #131B2C;
    --panel-2: #0F1729;
    --border: #26334A;
    --text: #E7EDF5;
    --text-muted: #7C8CA6;
    --accent: #5EEAD4;
    --accent-dim: #1F4A45;
    --radius: 6px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .mono { font-family: 'IBM Plex Mono', monospace; }

  header {
    padding: 40px clamp(20px, 4vw, 48px) 28px;
    border-bottom: 1px solid var(--border);
  }

  header .wordmark {
    font-size: 24px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  header .wordmark span { color: var(--text-muted); font-weight: 400; }

  header .tagline {
    color: var(--text-muted);
    font-size: 14px;
    margin-top: 8px;
    max-width: 60ch;
  }

  header .links {
    margin-top: 16px;
    display: flex;
    gap: 16px;
    font-size: 13px;
  }
  header .links a {
    color: var(--text-muted);
    text-decoration: none;
  }
  header .links a:hover { color: var(--accent); }

  main {
    max-width: 1180px;
    margin: 0 auto;
    padding: clamp(24px, 4vw, 48px);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px;
    display: flex;
    flex-direction: column;
  }

  .card .name {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 17px;
    font-weight: 600;
  }
  .card .name span { color: var(--text-muted); font-weight: 400; }

  .card .desc {
    color: var(--text-muted);
    font-size: 13.5px;
    line-height: 1.6;
    margin-top: 10px;
    flex: 1;
  }

  .card .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 14px;
  }
  .card .tag {
    font-size: 11px;
    color: var(--accent);
    background: var(--accent-dim);
    padding: 3px 8px;
    border-radius: 999px;
  }

  .card .actions {
    display: flex;
    gap: 10px;
    margin-top: 18px;
  }
  .card .actions a {
    flex: 1;
    text-align: center;
    font-size: 13px;
    font-weight: 500;
    padding: 9px 12px;
    border-radius: var(--radius);
    text-decoration: none;
  }
  .card .actions a.demo {
    background: var(--accent-dim);
    border: 1px solid var(--accent);
    color: var(--accent);
  }
  .card .actions a.demo:hover { background: var(--accent); color: #06201C; }
  .card .actions a.code {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text-muted);
  }
  .card .actions a.code:hover { border-color: var(--text-muted); color: var(--text); }

  .card.upcoming {
    opacity: 0.6;
  }
  .card.upcoming .name { color: var(--text-muted); }
  .card.upcoming .actions a {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text-muted);
    cursor: default;
    pointer-events: none;
  }

  footer {
    text-align: center;
    color: var(--text-muted);
    font-size: 12px;
    padding: 32px 20px 40px;
  }
  footer a { color: var(--text-muted); }
</style>
</head>
<body>

<header>
  <div class="wordmark">portfolio<span>.</span></div>
  <div class="tagline">A small collection of single purpose web tools. Each one solves one problem, runs mostly or entirely in your browser, and is free to use.</div>
  <div class="links">
    <a href="https://github.com/tfasanya79" target="_blank" rel="noopener">GitHub</a>
    <a href="https://www.linkedin.com/in/timfas/" target="_blank" rel="noopener">LinkedIn</a>
  </div>
</header>

<main>
  <div class="grid" id="grid"></div>
</main>

<footer>
  Built by Tim, one small tool at a time.
</footer>

<script>
  // Add future projects here. Each entry renders as a card automatically.
  const PROJECTS = [
    {
      name: 'subnet.',
      description: 'A clean, visual IPv4 subnet and CIDR calculator. Shows the network and host bit split, a full binary breakdown, and includes a VLSM subnet splitter and shareable links.',
      tags: ['networking', 'client side only'],
      demoUrl: 'https://aipal-staging.cloud/subnet-calculator/',
      codeUrl: 'https://github.com/tfasanya79/subnet-calculator',
    },
    {
      name: 'passcheck.',
      description: 'A password strength and known breach checker that runs entirely in the browser. Checks breach status with the Have I Been Pwned API using k-anonymity, so the password never leaves the page in full.',
      tags: ['security', 'privacy', 'client side only'],
      demoUrl: 'https://aipal-staging.cloud/passcheck/',
      codeUrl: 'https://github.com/tfasanya79/passcheck',
    },
  ];

  const grid = document.getElementById('grid');

  PROJECTS.forEach(p => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML =
      '<div class="name">' + p.name.replace(/\.$/, '') + '<span>.</span></div>' +
      '<div class="desc">' + p.description + '</div>' +
      '<div class="tags">' + p.tags.map(t => '<span class="tag">' + t + '</span>').join('') + '</div>' +
      '<div class="actions">' +
      '<a class="demo" href="' + p.demoUrl + '" target="_blank" rel="noopener">Live demo</a>' +
      '<a class="code" href="' + p.codeUrl + '" target="_blank" rel="noopener">Code</a>' +
      '</div>';
    grid.appendChild(card);
  });
</script>

</body>
</html>
